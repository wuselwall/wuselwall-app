# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "wuselwall"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and functions in this schema will get API
# endpoints. public and storage are always included.
schemas = ["api"]
# Extra schemas to add to the search_path of every request. public is always included.
extra_search_path = ["extensions"]
# The maximum number of rows returned from a view, table, or function. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv6)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://127.0.0.1:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://127.0.0.1:3000"]
# Our own keys: the CLI defaults are public and this stack is reachable from the internet.
# Values come from supabase/.env (git-ignored); CI writes throwaway ones (specs/16).
jwt_secret = "env(WW_JWT_SECRET)"
publishable_key = "env(WW_PUBLISHABLE_KEY)"
secret_key = "env(WW_SECRET_KEY)"
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
# On: a stranger who signs up gets an account that can do nothing but wait for an invitation
# or, while household creation is in `code` mode (app.instance_setting), start a family with a
# founder code (specs/20, ADR-014). Nothing in the account is reachable through RLS before that.
enable_signup = true
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false

[auth.email]
# Must stay true: it enables the email *provider* (password sign-in). Public sign-up is blocked by the top-level enable_signup = false above.
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in. On: with sign-up
# open, an unconfirmed address must never count as verified (invitations match it, specs/20).
# Email codes confirm the address themselves; nothing in the app signs up with a password.
enable_confirmations = true
# The sign-in code mailed to the address (specs/20, "With email"): six digits, valid for
# 600 seconds, and at most one new code per address every 60 seconds.
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# Fallback mails when the Send Email Hook is off: German first, English below, with the
# six-digit code ({{ .Token }}). CLI reads these paths; Compose serves the same files on
# its internal mail-templates service. deploy-supabase uploads their contents to hosted
# Auth. The hook renders the recipient's language instead (_shared/mail_*.ts).
[auth.email.template.magic_link]
subject = "Dein WuselWall-Code / Your WuselWall code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Dein WuselWall-Code / Your WuselWall code"
content_path = "./supabase/templates/confirmation.html"

# Uncomment to customize email template
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

# The default budget of two mails an hour would stop the onboarding journeys of the
# integration tests (a fresh address each); this stack only ever holds throwaway mail.
[auth.rate_limit]
email_sent = 100

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = true
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }} ."

# Use pre-defined map of phone number to OTP for testing.
[auth.sms.test_otp]
# 4152127777 = "123456"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/app/custom_access_token_hook"

# The Send Email Hook (specs/10 §4, specs/20 "Email"): GoTrue hands every mail to the send-email
# Edge Function instead of sending it, and that function renders it in the recipient's language
# and sends it through Scaleway Transactional Email. Off here: CLI and CI stacks catch mail in
# Mailpit (local_smtp) and need no Scaleway project. A compose stack switches it
# on in infra/supabase/docker-compose.wuselwall.yml. To try it on a laptop, set enabled = true,
# put SEND_EMAIL_HOOK_SECRET (v1,whsec_<base64>) and the SCW_* / MAIL_FROM* values in supabase/.env.
[auth.hook.send_email]
enabled = false
uri = "http://host.docker.internal:54321/functions/v1/send-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"


# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `slack`, `spotify`, `workos`, `zoom`.

[analytics]
enabled = false
port = 54327
vector_port = 54328
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# Guardians enrol TOTP in Settings; without a verified factor nothing changes for them.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Passkeys (beta in Supabase Auth). The relying-party id must be the real domain in
# production; for local web runs it is "localhost".
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "WuselWall"
rp_id = "localhost"
rp_origins = ["http://localhost:3000"]

# Functions called without a user (ADR-018). They check the caller themselves: the ICS
# token, the jobs' x-cron-secret (holidays-sync also takes a user JWT and verifies it),
# and server-info is public by design. Hosted Supabase verifies a JWT by default, so a
# plain `supabase functions deploy` needs these; the compose stack's router has the same
# list (infra/supabase/volumes/functions/main/index.ts).
[functions.ics]
verify_jwt = false

[functions.tasks-nightly]
verify_jwt = false

[functions.holidays-sync]
verify_jwt = false

[functions.calendar-import]
verify_jwt = false

[functions.server-info]
verify_jwt = false

# Apple Shortcuts send a shortcut token, not a JWT; api.shortcut_* checks it.
[functions.shortcuts]
verify_jwt = false

# Assistants send an assistant key, not a JWT; api.mcp_context checks it.
[functions.mcp]
verify_jwt = false
