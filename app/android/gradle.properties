# The template's 8 GB heap and 4 GB metaspace are sized for a workstation. On a CI runner
# the release build with them held about 10 GB of process memory (2026-10-24), and its
# container's limit also counts the workspace when that is a RAM disk. A 4 GB heap is
# enough, and Kotlin compiles inside the Gradle daemon instead of a second JVM, so a full
# heap ends in an OutOfMemoryError rather than the kernel killing the daemon.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
