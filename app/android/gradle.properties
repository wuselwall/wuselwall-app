# The CI runners' containers have 8 GB in all: Gradle's heap and metaspace stay well below
# that, and Kotlin compiles inside the Gradle daemon instead of a second JVM, so the Flutter
# tool and R8 keep room (two release builds were killed at the limit on 2026-10-24).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
