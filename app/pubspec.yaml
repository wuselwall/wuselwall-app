name: wuselwall
description: WuselWall household app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: 3.47.7

dependencies:
  app_links: 7.2.1
  camera: ^0.12.1
  characters: ^1.4.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  # cupertino_ui (pulled in by Flutter) refers to this font; without it the build warns.
  cupertino_icons: ^1.0.9
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  # Pinned: 22.3.2 was two days old when reminders were added; move up after a review.
  flutter_local_notifications: 22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  http: ^1.2.0
  intl: any
  package_info_plus: ^10.2.2
  passkeys: ^2.23.1
  qr: ^4.0.0
  share_plus: ^13.3.1
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  uuid: ^4.6.0
  zxing2: ^0.2.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  otp: ^3.2.1

flutter:
  uses-material-design: true
  generate: true

  # Self-hosted, never fetched at runtime (NFR-9). Licences: assets/fonts/OFL-*.txt,
  # registered with LicenseRegistry in app/licenses.dart.
  assets:
    - assets/fonts/OFL-AtkinsonHyperlegibleNext.txt
    - assets/fonts/OFL-BarlowSemiCondensed.txt
    # Emoji pictures (Fluent Emoji Flat, MIT, licence in assets/emoji/), rendered by
    # scripts/emoji-pictures.mjs; the 2.0x/ and 3.0x/ variants are picked automatically.
    - assets/emoji/
    - assets/emoji/shopping/
    - assets/emoji/tasks/
    - assets/emoji/extras/
    # Google's "G" for its sign-in button, as its branding rules require; rendered at
    # 20 dp from google_g.svg (the 2.0x/ and 3.0x/ variants are picked automatically).
    - assets/sign_in/google_g.png
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700

# App icons from the Wuselpunkte mark (specs/brand, ADR-012). Regenerate with
# `dart run flutter_launcher_icons` after changing anything in assets/icon/.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  image_path_ios: assets/icon/icon-ios.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F7F4EE"
  adaptive_icon_foreground: assets/icon/adaptive-foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#F7F4EE"
    theme_color: "#2D6A4F"
