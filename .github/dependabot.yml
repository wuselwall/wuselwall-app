# Dependency updates (specs/11, T5; specs/10#updates): weekly, grouped, reviewed —
# never auto-merged. The cooldown waits a week after a release before proposing it, the
# window in which most hijacked packages are caught and pulled; security updates skip it.
#
# Not here, on purpose:
# - Supabase images (infra/supabase): they follow the Supabase CLI in package.json, which
#   the npm entry below bumps; specs/10#updates carries them over by hand.
# - Gradle plugins (app/android): AGP and Kotlin move with Flutter's own requirements.
version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      pub-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /                 # docs and tooling: VitePress, Playwright, Supabase CLI, sharp
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      tooling-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      website-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: bundler
    directories: [/app/ios, /app/android]   # fastlane; one PR keeps both locks equal
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      fastlane: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /website          # node base image, pinned by digest
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
