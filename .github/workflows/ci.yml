# Pull requests get the fast checks: format, analyse, unit and widget tests, the website
# build, the dependency audit. A tag v*.*.* (the release, next to release-mobile.yml and build-android.yml) or
# "Run workflow" adds the web build and the backend: every migration from zero, pgTAP, the
# integration test. Run it by hand on a branch before its migration goes to homeserver (specs/10).
name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*.*.*']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage   # includes the en/de ARB parity test
      - run: flutter build web --release --dart-define-from-file=env/ci.json
        if: github.event_name != 'pull_request'

  website:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
      - run: npm run build   # placeholders in the Impressum are allowed here; remote-web.sh deploy refuses them
      - name: Built pages carry their content (SSR/SEO smoke test)
        run: |
          grep -q '<h1>' dist/client/index.html
          grep -q 'hreflang="de-CH"' dist/client/en/index.html
          test -s dist/client/sitemap-index.xml

  # Known vulnerabilities in every lockfile (specs/11, T5). Accepted ones, each with a
  # reason and an expiry, live in osv-scanner.toml next to the lockfile.
  audit:
    runs-on: ubuntu-latest
    env:
      OSV_VERSION: v2.6.0
      OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  osv-scanner" | sha256sum -c
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=app/pubspec.lock \
            --lockfile=app/ios/Gemfile.lock --lockfile=package-lock.json \
            --lockfile=website/package-lock.json

  backend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # config.toml reads its keys from supabase/.env (ADR-013). This stack is throwaway,
      # so it gets the CLI's public defaults, which env/ci.json expects.
      - run: |
          cat > supabase/.env <<'EOF'
          WW_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
          WW_PUBLISHABLE_KEY=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          WW_SECRET_KEY=sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
          EOF
      - run: npx supabase start -x studio,imgproxy,logflare,vector
      - run: npx supabase db reset      # every migration from zero, plus seed
      - run: npx supabase test db       # pgTAP
      - run: npx supabase db lint --level warning
      # The app's repositories against the real stack: identity, enrolment, shopping,
      # realtime. Needs studio-less start from above; uses the public local dev key.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      - run: flutter pub get --enforce-lockfile && flutter test test/integration --dart-define-from-file=env/ci.json
        working-directory: app
