# Pull requests get the fast checks: format, analyse, unit and widget tests, the website
# build, the dependency audit. A tag v*.*.* (the release, next to release-ios.yml and
# release-android.yml) or "Run workflow" adds the web build. The disposable backend
# (migrations, pgTAP, the Flutter integration test) and the Deno unit tests for Edge
# Functions live in backend-ci.yml, which runs on every pull request and skips its heavy
# jobs through its own change detector rather than a workflow-level path filter, and
# always in full on a tag or "Run workflow" (specs/10).
#
# Every job here executes PR-supplied code (dependency installs included), so for a
# pull_request event it runs on the GitHub-hosted, ephemeral ubuntu-latest runner rather
# than the self-hosted fleet; only a push tag or a manual "Run workflow" (both
# maintainer-triggered, not PR-controlled) uses [self-hosted, Linux, build].
name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*.*.*']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  app:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","build"]') }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage   # includes the en/de ARB parity test
      - run: flutter build web --release --dart-define-from-file=env/ci.json
        if: github.event_name != 'pull_request'

  website:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","build"]') }}
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: website/package-lock.json }
      - run: npm ci
      - run: npm run build   # placeholders in the Impressum are allowed here; remote-web.sh deploy refuses them
      - name: Built pages carry their content (SSR/SEO smoke test)
        run: |
          grep -q '<h1>' dist/client/index.html
          grep -q 'hreflang="de-CH"' dist/client/en/index.html
          test -s dist/client/sitemap-index.xml

  # Known vulnerabilities in every lockfile (specs/11, T5). Accepted ones, each with a
  # reason and an expiry, live in osv-scanner.toml next to the lockfile.
  audit:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","build"]') }}
    env:
      OSV_VERSION: v2.6.0
      OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  osv-scanner" | sha256sum -c
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=app/pubspec.lock \
            --lockfile=app/ios/Gemfile.lock --lockfile=package-lock.json \
            --lockfile=website/package-lock.json
