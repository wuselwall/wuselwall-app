# Conservative job-level selection preserves the required context on every PR.
# Server/client-contract changes get the disposable stack; Edge Function changes get
# Deno as well. Reusable/manual/tag runs are always full, regardless of paths.
# Build runners use a CI-only Docker daemon, with the shared stack serialized and
# removed after each run. Detectors, Deno and aggregates use GitHub-hosted runners.
name: backend-ci
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_checks:
        description: Reusable calls inherit the caller event; force full even for PR callers
        type: boolean
        default: true
  pull_request:
  push:
    tags: ['v*.*.*']
concurrency:
  group: ${{ github.workflow }}-backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  # Same conservative classifier as ci; no database or build runner needed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      edge: ${{ steps.detect.outputs.edge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 22, package-manager-cache: false }
      - id: detect
        run: node scripts/ci-changes.mjs
        env:
          FULL_CHECKS: ${{ inputs.full_checks }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  edge-functions:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: '2.5.6' }
      # Deno's module cache lives in this job's own temp directory, not the default under
      # $HOME: on a self-hosted runner Deno could not write there ("Failed caching
      # 'https://jsr.io/...'" right after a successful download). The runner empties
      # runner.temp for every job, so each run starts cold and --frozen checks every
      # module against deno.lock instead of trusting another job's downloads.
      - run: deno test supabase/functions/ --allow-env --allow-read --node-modules-dir=none --lock=deno.lock --frozen
        env: { DENO_DIR: '${{ runner.temp }}/deno' }

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, Linux, build]
    # One repository-wide group: one disposable stack at a time across all pull requests.
    # `queue: max` keeps every waiting backend job in FIFO order (up to 100). Without it
    # GitHub allows a single pending job per group and cancels it when the next pull
    # request's backend job arrives ("Canceling since a higher priority waiting request
    # for backend-ci-local-stack exists"), which fails that PR's `required` check. A newer
    # push to the same PR still removes the stale run through the workflow-level group.
    # `queue: max` cannot be combined with `cancel-in-progress: true`.
    concurrency:
      group: backend-ci-local-stack
      cancel-in-progress: false
      queue: max
    # Every CLI image (the stack, pg_prove for `test db`) from GHCR rather than the default
    # ECR Public, whose anonymous data limit the shared egress IPs of GitHub-hosted runners
    # regularly exhaust ("toomanyrequests: Data limit exceeded"). Supabase mirrors each image
    # there; a CLI bump that needs one GHCR lacks fails loudly instead of falling back.
    env: { SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: "${{ github.event_name == 'pull_request' && 'npm' || '' }}", package-manager-cache: false }
      - run: npm ci
      # config.toml reads its keys from supabase/.env (ADR-013). This stack is throwaway,
      # so it gets the CLI's public defaults, which env/ci.json expects.
      - run: |
          cat > supabase/.env <<'EOF'
          WW_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
          WW_PUBLISHABLE_KEY=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          WW_SECRET_KEY=sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
          EOF
      # Every image the CLI needs below, by pinned digest, before the CLI looks for it. A
      # runner whose GHCR pulls keep answering `toomanyrequests` gets the same digest from
      # ECR Public or Docker Hub; any other pull error, or pins that no longer match this
      # CLI's versions, fail here (scripts/backend-stack-images.mjs).
      - run: node scripts/backend-stack-images.mjs
      - run: npx supabase start -x studio,imgproxy,logflare,vector
      - run: npx supabase db reset      # every migration from zero, plus seed
      - run: npx supabase test db       # pgTAP
      - run: npx supabase db lint --level warning
      # The app's repositories against the real stack: identity, enrolment, shopping,
      # realtime. Needs studio-less start from above; uses the public local dev key.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: app/pubspec.yaml, cache: "${{ github.event_name == 'pull_request' }}" }
      - run: flutter pub get --enforce-lockfile && flutter test test/integration --dart-define-from-file=env/ci.json -j 1
        working-directory: app
      # The same stack without mail (specs/20, Q48): Auth autoconfirms, the app signs up with
      # a password, a guardian's code resets one. A fresh database, so the seed's founder
      # codes are unused again (start applies the migrations and the seed).
      - name: Restart the stack without mail
        run: |
          sed -i 's/^enable_confirmations = true$/enable_confirmations = false/' supabase/config.toml
          grep -qx 'enable_confirmations = false' supabase/config.toml
          npx --no-install supabase stop --no-backup
          npx supabase start -x studio,imgproxy,logflare,vector
      - run: flutter test test/integration/no_mail_integration_test.dart --dart-define-from-file=env/ci.json --dart-define=WW_NO_MAIL=true -j 1
        working-directory: app
      - name: Stop the disposable backend
        if: always()
        run: npx --no-install supabase stop --no-backup

  # The single required status check for branch protection (see the file header). Always
  # runs and always terminates with success or failure, whether edge-functions/backend ran
  # or were skipped as backend-irrelevant, so a docs-only PR is never stuck on Pending.
  required:
    needs: [changes, edge-functions, backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - run: node scripts/ci-gate.mjs
        env:
          GATE: backend
          NEEDS_JSON: ${{ toJSON(needs) }}
