# Household data, security (RLS) and Edge Function changes get an executable gate before
# the pilot rollout (specs/03, ADR-013). Three jobs:
#
#   changes           always runs, on a GitHub-hosted runner, for every pull request. It
#                     only reads `git diff` between the PR's base and head commit -- it
#                     never builds, installs or executes anything from the PR -- and
#                     decides whether the backend-sensitive inputs below changed. A tag
#                     v*.*.* or "Run workflow" always treats itself as backend-sensitive,
#                     so a release is never gated on an imperfect path list (ADR-011's "run
#                     it by hand on a branch before its migration goes to a live server").
#
#   edge-functions    deno test for every supabase/functions/_shared/*_test.ts (not a
#                     hand-picked subset). No Docker, no network permission at runtime:
#                     the code under test never calls out, and npm/jsr modules resolve
#                     from Deno's own cache rather than a node_modules the repository
#                     root's package.json would otherwise pull unrelated workspace
#                     dependencies (Playwright, Sharp, the Supabase CLI, VitePress) into.
#                     --frozen on the repository's deno.lock makes the run reproducible:
#                     a dependency drifting out from under the pin fails the job instead
#                     of silently re-resolving.
#
#   backend           npx supabase start on a throwaway local stack, every migration from
#                     zero, pgTAP (RLS included), the schema lint, then the Flutter
#                     repositories against that stack (test/integration). This is the
#                     official stack, heavier than the app's fast checks in ci.yml, so it
#                     runs only when `changes` says it is needed.
#
#   required          always runs (if: always()), on a GitHub-hosted runner, after the two
#                     jobs above. It is the one check to mark "required" in branch
#                     protection: a workflow-level `paths:` filter leaves GitHub's status
#                     for a skipped run at Pending forever (documented GitHub behaviour,
#                     not a bug here), which would deadlock a docs-only pull request that
#                     can never produce that check. `required` always reports
#                     success/failure once `changes`, `edge-functions` and `backend` have
#                     all finished, whether they ran or were skipped as backend-irrelevant,
#                     so branch protection always gets a terminal answer. Point branch
#                     protection at job `required` (check name "backend-ci / required"),
#                     not at `edge-functions` or `backend` directly.
#
# Untrusted PR code never runs on the self-hosted fleet: `edge-functions` executes
# PR-supplied Deno code (the test subjects' own imports, not just the test harness), so for
# a `pull_request` event it runs on the GitHub-hosted `ubuntu-latest` runner, torn down
# after the job, rather than on [self-hosted, Linux, build]; the host-side fast checks in
# ci.yml get the same treatment. `backend` already runs on `ubuntu-latest` (it needs a
# Docker daemon of its own for `supabase start`), which also keeps its `npm ci` / `flutter
# pub get` install-time code off self-hosted hardware for a pull_request. Approving a fork
# PR for CI is not containment by itself -- the runner itself must not be shared,
# persistent or credentialed; this workflow intentionally never uses `pull_request_target`,
# which would hand PR-controlled code the base ref's secrets.
name: backend-ci
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*.*.*']
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # Decides whether this pull request can plausibly affect the backend or the Flutter
  # integration suite that runs against it. Reads `git diff` only -- no PR code is
  # installed, built or executed here -- so this job is safe on any runner; it stays on
  # ubuntu-latest because it is cheap and has no self-hosted dependency.
  changes:
    runs-on: ubuntu-latest
    if: always()
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # Manual run or a release tag: always backend-sensitive, never path-gated.
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fetch-depth: 0 above already has full history, including the PR's merge ref;
          # this fetch is a belt-and-suspenders retry, not the only way the SHAs get here.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" || true
          if ! git cat-file -e "$BASE_SHA" 2>/dev/null || ! git cat-file -e "$HEAD_SHA" 2>/dev/null; then
            # Can't resolve one of the commits: fail open to "run everything" rather than
            # silently skip the backend gate on an undiagnosed git problem.
            echo "::warning::backend-ci changes-detector could not resolve $BASE_SHA/$HEAD_SHA; running the full gate"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"
          # Every input the edge-functions/backend jobs below can actually exercise:
          # the backend tree itself, the two lockfiles that pin its dependencies, this
          # workflow file, and the Flutter integration suite plus everything it needs to
          # build and run (repository code, pubspec lock, the ci.json dart-define file,
          # dart_test.yaml). A test-only or app-only PR that touches any of these must not
          # skip this gate.
          pattern='^(supabase/|package\.json$|package-lock\.json$|deno\.lock$|\.github/workflows/backend-ci\.yml$|app/test/integration/|app/lib/|app/pubspec\.yaml$|app/pubspec\.lock$|app/env/ci\.json$|app/dart_test\.yaml$)'
          if echo "$changed" | grep -Eq "$pattern"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  edge-functions:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Runs PR-supplied Deno code (the modules under test, not just the harness): a
    # GitHub-hosted, ephemeral runner for a pull_request, never the self-hosted fleet.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","build"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: '2.5.6' }
      - run: deno test supabase/functions/_shared/ --allow-env --allow-read --node-modules-dir=none --lock=deno.lock --frozen

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest   # supabase start needs a Docker daemon of its own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # config.toml reads its keys from supabase/.env (ADR-013). This stack is throwaway,
      # so it gets the CLI's public defaults, which env/ci.json expects.
      - run: |
          cat > supabase/.env <<'EOF'
          WW_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
          WW_PUBLISHABLE_KEY=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          WW_SECRET_KEY=sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz
          EOF
      - run: npx supabase start -x studio,imgproxy,logflare,vector
      - run: npx supabase db reset      # every migration from zero, plus seed
      - run: npx supabase test db       # pgTAP
      - run: npx supabase db lint --level warning
      # The app's repositories against the real stack: identity, enrolment, shopping,
      # realtime. Needs studio-less start from above; uses the public local dev key.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      - run: flutter pub get --enforce-lockfile && flutter test test/integration --dart-define-from-file=env/ci.json
        working-directory: app

  # The single required status check for branch protection (see the file header). Always
  # runs and always terminates with success or failure, whether edge-functions/backend ran
  # or were skipped as backend-irrelevant, so a docs-only PR is never stuck on Pending.
  required:
    needs: [changes, edge-functions, backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate edge-functions and backend results
        run: |
          set -euo pipefail
          fail=0
          echo "changes.backend = ${{ needs.changes.result }}"
          echo "edge-functions   = ${{ needs.edge-functions.result }}"
          echo "backend          = ${{ needs.backend.result }}"
          for r in "${{ needs.changes.result }}" "${{ needs.edge-functions.result }}" "${{ needs.backend.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::backend-ci gate failed: a dependency reported '$r'"; fail=1 ;;
            esac
          done
          exit "$fail"
