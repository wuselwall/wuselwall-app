# A signed APK for the family's Android devices, installed by hand until the Play
# internal track exists (specs/16, step 7). scripts/deploy-apk.sh publishes it at
# https://wusel.goomba.ch/download/wuselwall.apk.
name: build-android
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', '.github/workflows/build-android.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-android.yml']
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      - run: ./tool/write_android_signing.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # The run number as versionCode: every build installs over the previous one.
      - run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define-from-file=env/dev.json
      - run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/wuselwall.apk
          # The signature Android checks on every update — must never change. apksigner,
          # because the APK carries only the v2/v3 scheme, which keytool cannot read.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs build/wuselwall.apk | grep -E 'DN:|SHA-256'
      - uses: actions/upload-artifact@v4
        with:
          name: wuselwall-apk
          path: app/build/wuselwall.apk
          retention-days: 30
