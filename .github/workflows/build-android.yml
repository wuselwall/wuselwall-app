# A signed APK for the family's Android devices, installed by hand until the Play
# internal track exists (specs/16, step 7). scripts/deploy-apk.sh publishes it at
# https://wuselwall.app/download/wuselwall.apk. A tag v*.*.* builds it, like
# release-mobile.yml; "Run workflow" builds the pubspec version from any branch.
name: build-android
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      # Exactly the packages in pubspec.lock, checked against their hashes, before the
      # signing secrets come near the build.
      - run: flutter pub get --enforce-lockfile
      - run: ./tool/write_android_signing.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # The run number as versionCode: every build installs over the previous one. A tag
      # sets the version name; a manual run keeps the one in pubspec.yaml.
      - run: |
          args=(--build-number=${{ github.run_number }})
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args+=(--build-name="${GITHUB_REF_NAME#v}"); fi
          flutter build apk --release "${args[@]}" --dart-define-from-file=env/dev.json
      - run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/wuselwall.apk
          # The signature Android checks on every update — must never change. apksigner,
          # because the APK carries only the v2/v3 scheme, which keytool cannot read.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs build/wuselwall.apk | grep -E 'DN:|SHA-256'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wuselwall-apk
          path: app/build/wuselwall.apk
          retention-days: 30
