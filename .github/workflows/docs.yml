# VitePress source remains with the app. Build and Pages publishing run on GitHub's
# runners, free for this public repository; nothing here needs the self-hosted fleet.
# Build jobs have read-only repository access and no deployment secrets.
# Pages publishing stays opt-in through DOCS_PAGES_ENABLED and never runs for a PR.
# See specs/website-and-docs-migration.md.
name: docs
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml', '.github/workflows/docs-validation.yml']
  push:
    branches: [main]
    paths: ['app/**', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml', '.github/workflows/docs-validation.yml']
concurrency:
  group: docs-${{ github.ref }}
  # A full screenshot matrix takes longer than the gap between main merges. Let an
  # active main publication finish; PR updates can still cancel their older preview.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/docs-validation.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true' }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency: { group: docs-deploy, cancel-in-progress: false }
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
