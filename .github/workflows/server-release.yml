# A server release (ADR-018, decision 9): on a tag server-v<version>, the archive that
# server/wuselwall installs and updates from, attached to a GitHub release. Families
# download it; the project runs nothing for them.
name: server-release
on:
  push:
    tags: ['server-v*']
permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  qualification:
    runs-on: [self-hosted, Linux, build]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false }
      - run: node qualification/promotion.mjs
        env: { GH_TOKEN: '${{ github.token }}' }

  release:
    needs: qualification
    environment: release-promotion
    permissions: { contents: write }
    runs-on: [self-hosted, Linux, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: app/pubspec.yaml, cache: false }
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Build
        run: scripts/build-server-release.sh "${GITHUB_REF_NAME#server-v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#server-v}
          gh release create "$GITHUB_REF_NAME" "dist/wuselwall-server-$version.tar.gz" \
            --title "WuselWall server $version" \
            --notes "Install or update: see https://wuselwall.app/docs/en/server/ (German: https://wuselwall.app/docs/server/)."
