# Puts the WuselWall server into a family's own hosted Supabase project, from a copy (fork)
# of this repository, without installing anything (docs/server/supabase-cloud). Started by
# hand ("Run workflow"); run it again for an update. The project runs nothing here: the
# workflow runs in the family's repository, with the family's secrets, against the
# family's project, on GitHub's runners (a fork has none of its own).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   an access token of the family's Supabase account
#   SUPABASE_PROJECT_ID     the project's reference ID (https://<id>.supabase.co)
#   SUPABASE_DB_PASSWORD    the database password chosen when the project was created
#   WUSELWALL_SETUP_TOKEN   optional: a phrase of the family's choice, used once to found
#                           the household. Ignored once a household exists.
#
# Mail is optional (specs/20, Q48). Without it, everyone signs up and signs in with email and
# password, and a guardian resets a forgotten password in the app. With one of these, sign-in
# codes come by mail:
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_SENDER [, SMTP_SENDER_NAME]
#                           any SMTP server, e.g. a transactional-mail provider or Gmail with
#                           an app password (scripts/hosted-auth-config.mjs)
#   SCW_SECRET_KEY, SCW_PROJECT_ID, MAIL_FROM [, SCW_REGION, MAIL_FROM_NAME]
#                           Scaleway Transactional Email through the send-email hook, as the
#                           compose stack does (the hook's secret is generated here)
# Supabase's built-in mailer is never relied on: it delivers only to the account's own
# addresses, a few times an hour.
#
# With "web" ticked, the web app is published on this repository's GitHub Pages
# (Settings → Pages → Source: GitHub Actions, once). It asks for the server on first use.
#
# Logs of a public fork are public. No step prints a secret: GitHub masks the secrets, and
# the secrets generated here are masked before use.
name: deploy-supabase
on:
  workflow_dispatch:
    inputs:
      language:
        description: Server email language
        type: choice
        options: [de, en, fr, es]
        default: de
        required: true
      web:
        description: Also publish the web app on GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT: ${{ secrets.SUPABASE_PROJECT_ID }}
      SETUP_TOKEN: ${{ secrets.WUSELWALL_SETUP_TOKEN }}
      MAIL_LANGUAGE: ${{ inputs.language }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
      SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
      SCW_REGION: ${{ secrets.SCW_REGION }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags: a checkout on a server-v tag reports that release to the app.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Check the secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT; do
            [ -n "${!v}" ] || { echo "::error::secret missing: ${v/PROJECT/SUPABASE_PROJECT_ID}"; exit 1; }
          done
          [[ $PROJECT =~ ^[a-z0-9]{20}$ ]] || { echo "::error::SUPABASE_PROJECT_ID is the 20-letter reference ID"; exit 1; }
          if [ -n "$SCW_SECRET_KEY" ]; then
            for v in SCW_PROJECT_ID MAIL_FROM; do
              [ -n "${!v}" ] || { echo "::error::SCW_SECRET_KEY is set, so $v is needed too"; exit 1; }
            done
          fi
          if [ -z "$SMTP_HOST" ] && [ -z "$SCW_SECRET_KEY" ]; then
            echo "::notice::No mail configured: sign-in with email and password (docs/server/extras)."
          fi

      - name: Database
        run: |
          # config.toml's env() values are for local stacks; the defaults satisfy the parser.
          cp supabase/.env.example supabase/.env
          npx supabase link --project-ref "$PROJECT" --password "$SUPABASE_DB_PASSWORD"
          # Never --include-seed: the seed is development data.
          npx supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Data API
        run: |
          # PostgREST serves only the api schema (ADR-010).
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT/postgrest" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d '{"db_schema":"api","db_extra_search_path":"public, extensions","max_rows":1000}' > /dev/null

      - name: Edge Functions
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "CRON_SECRET=$secret" >> "$GITHUB_ENV"
          set -- "CRON_SECRET=$secret" "MAIL_LANGUAGE=$MAIL_LANGUAGE"
          # The project's publishable key, for the discovery document the app reads before
          # anyone signs in (_shared/server_info.ts): the hosted runtime does not pass it.
          key=$(curl -fsS "https://api.supabase.com/v1/projects/$PROJECT/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '[.[] | select(.type == "publishable")][0].api_key // empty')
          if [[ $key == sb_publishable_* ]]; then
            set -- "$@" "WW_PUBLISHABLE_KEY=$key"
          else
            echo "::warning::The project has no publishable key yet; the discovery document uses the legacy anon key."
          fi
          # A checkout exactly on a server release tag announces that release to the app.
          if version=$(git describe --tags --exact-match --match 'server-v*' 2> /dev/null); then
            set -- "$@" "WW_SERVER_VERSION=${version#server-v}"
          fi
          if [ -n "$SCW_SECRET_KEY" ]; then
            # The Send Email Hook's secret (Standard Webhooks): Auth signs with it, the
            # function checks it. New on every run; both sides are set in this run.
            hook="v1,whsec_$(openssl rand -base64 32)"
            echo "::add-mask::$hook"
            echo "SEND_EMAIL_HOOK_SECRET=$hook" >> "$GITHUB_ENV"
            set -- "$@" "SEND_EMAIL_HOOK_SECRET=$hook" "SCW_SECRET_KEY=$SCW_SECRET_KEY" \
              "SCW_PROJECT_ID=$SCW_PROJECT_ID" "SCW_REGION=${SCW_REGION:-fr-par}" \
              "MAIL_FROM=$MAIL_FROM" "MAIL_FROM_NAME=${MAIL_FROM_NAME:-WuselWall}"
          fi
          npx supabase secrets set --project-ref "$PROJECT" "$@"
          # verify_jwt per function comes from config.toml ([functions.*]).
          npx supabase functions deploy --project-ref "$PROJECT" --use-api

      - name: Auth settings
        # Sign-up on, the access-token hook, TOTP, the compose overlay's limits, and mail
        # (SMTP, the send-email hook, or none: then addresses are autoconfirmed); read back after.
        run: node scripts/hosted-auth-config.mjs

      - name: Email code templates
        # SMTP fallback must contain the code the app requests, for signup and sign-in.
        # Upload canonical single-language templates and verify settings by readback.
        run: node scripts/hosted-email-templates.mjs

      - name: Retire social sign-in
        # Google and Apple sign-in, identity linking and the native OAuth callback off, the
        # retired apple-token function and the Apple secrets deleted, all read back (specs/10).
        run: node scripts/hosted-retire-social.mjs

      - name: Scheduled jobs and the setup key
        run: |
          query() {
            jq -n --arg q "$1" '{query: $q}' | curl -fsS -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d @-
          }
          # infra/jobs/schedule.sql without psql: its two variables filled in.
          sql=$(sed -e '/^\\set /d' \
            -e "s|:'functions_url'|'https://$PROJECT.supabase.co/functions/v1'|g" \
            -e "s|:'cron_secret'|'$CRON_SECRET'|g" infra/jobs/schedule.sql)
          query "$sql" > /dev/null
          if [ -n "$SETUP_TOKEN" ]; then
            # The server compares the key in lower case (api.setup_claim, api.household_create).
            hash=$(printf '%s' "$SETUP_TOKEN" | tr '[:upper:]' '[:lower:]' | sha256sum | cut -d' ' -f1)
            query "do \$\$ begin
              if not exists (select 1 from app.household) then
                delete from app.setup_token;
                insert into app.setup_token (token_hash) values ('$hash');
              end if;
            end \$\$;" > /dev/null
          fi

      - name: Verify the server
        # What a family would otherwise find out later: the discovery document answers, the
        # four jobs are scheduled and reach their functions (a 401 here means a function is
        # missing from config.toml's verify_jwt list), sign-up is on, and the sign-in the app
        # will offer (email code or password only) matches the mail configured.
        run: |
          base=https://$PROJECT.supabase.co
          api() {
            curl -fsS "https://api.supabase.com/v1/projects/$PROJECT/$1" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' "${@:2}"
          }
          doc=$(curl -fsS "$base/functions/v1/server-info") \
            || { echo "::error::server-info does not answer"; exit 1; }
          jq -e '.wuselwall == 1 and (.publishable_key | length) > 0 and (.api_version | type) == "number"' <<< "$doc" > /dev/null \
            || { echo "::error::the discovery document is incomplete"; exit 1; }
          echo "server-info: api_version $(jq -r .api_version <<< "$doc"), features $(jq -c .features <<< "$doc")"
          for fn in tasks-nightly holidays-sync calendar-import household-purge; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 300 -X POST \
              -H "x-cron-secret: $CRON_SECRET" -H 'content-type: application/json' --data '{}' "$base/functions/v1/$fn")
            [ "$status" = 200 ] || { echo "::error::$fn answered HTTP $status to the scheduled call"; exit 1; }
            echo "$fn: 200"
          done
          jobs=$(jq -n '{query: "select count(*) as n from cron.job where jobname like '"'"'wuselwall-%'"'"'"}' \
            | api database/query -X POST -d @- | jq -r '.[0].n')
          [ "$jobs" = 4 ] || { echo "::error::$jobs scheduled jobs instead of 4"; exit 1; }
          echo "cron.job: 4 wuselwall-* jobs"
          auth=$(api config/auth)
          jq -e '.disable_signup == false' <<< "$auth" > /dev/null \
            || { echo "::error::sign-up is off; nobody could create the first account"; exit 1; }
          if [ -n "$SMTP_HOST" ] || [ -n "$SCW_SECRET_KEY" ]; then mail=true; else mail=false; fi
          jq -e --argjson mail "$mail" '.mailer_autoconfirm == ($mail | not)' <<< "$auth" > /dev/null \
            || { echo "::error::Auth's autoconfirm does not match the mail configured"; exit 1; }
          jq -e --argjson mail "$mail" '.sign_in.email_code == $mail' <<< "$doc" > /dev/null \
            || { echo "::error::the discovery document's sign_in.email_code is not $mail"; exit 1; }
          echo "auth: sign-up on, $(jq -r 'if .hook_send_email_enabled then "sign-in codes through the send-email hook" elif ((.smtp_host // "") | length) > 0 then "sign-in codes through SMTP" else "no mail: email and password" end' <<< "$auth")"

      - name: Summary
        run: |
          {
            echo "### WuselWall is on your Supabase project"
            echo
            # The project ID is a secret, so GitHub would print it as ***.
            echo "In the WuselWall app, enter your project ID (the value of SUPABASE_PROJECT_ID) at **Which server?**."
            echo
            if [ -n "$SETUP_TOKEN" ]; then
              echo "Then tap **I have the setup key** and enter the phrase you saved as \`WUSELWALL_SETUP_TOKEN\`: only that key can create the first account."
              echo
            fi
            if [ -z "$SMTP_HOST" ] && [ -z "$SCW_SECRET_KEY" ]; then
              echo "> **Without mail:** everyone signs up with email and password. A guardian resets a forgotten password in the app (Members). Add the SMTP secrets and run again whenever you want sign-in codes by mail."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    if: inputs.web
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      - id: configure
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        working-directory: app
        run: |
          # Without a server: it asks once, and the browser remembers (ADR-018).
          flutter build web --release --no-web-resources-cdn \
            --base-href "${{ steps.configure.outputs.base_path }}/" \
            --dart-define=ENV=pages -o build/web-pages
          # GitHub Pages has no fallback to index.html; its 404 page serves the app instead.
          cp build/web-pages/index.html build/web-pages/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: app/build/web-pages }
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
