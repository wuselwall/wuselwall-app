# Signed Android builds (specs/16, step 7); release-ios.yml is its iOS twin. The App
# Bundle (.aab) goes to the Play internal testing track; the APK stays the fallback that
# scripts/deploy-apk.sh publishes at https://wuselwall.app/download/wuselwall.apk. A tag
# v*.*.* builds both and uploads the bundle; "Run workflow" builds the pubspec version from
# any branch and uploads it only when asked to.
name: release-android
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the App Bundle to the Play internal track
        type: boolean
        default: false
  push:
    tags: ['v*.*.*']
concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  apk:
    runs-on: [self-hosted, Linux, build]
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      # Exactly the packages in pubspec.lock, checked against their hashes, before the
      # signing secrets come near the build.
      - run: flutter pub get --enforce-lockfile
      - run: ./tool/write_android_signing.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # The run number plus 100 as versionCode: every build installs over the previous one,
      # though the count restarted at 1 when the workflow was renamed from build-android.yml
      # (whose last build was 14). A tag sets the version name; a manual run keeps the one
      # in pubspec.yaml.
      # No server is compiled in (env/store.json, ADR-018): the person chooses one.
      - run: |
          args=(--build-number=$(( ${{ github.run_number }} + 100 )))
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args+=(--build-name="${GITHUB_REF_NAME#v}"); fi
          for target in apk appbundle; do
            flutter build "$target" --release "${args[@]}" --dart-define-from-file=env/store.json
          done
      - run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/wuselwall.apk
          mv build/app/outputs/bundle/release/app-release.aab build/wuselwall.aab
          # The signature Android checks on every update — must never change. apksigner,
          # because the APK carries only the v2/v3 scheme, which keytool cannot read.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs build/wuselwall.apk | grep -E 'DN:|SHA-256'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wuselwall-apk
          path: app/build/wuselwall.apk
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wuselwall-aab
          path: app/build/wuselwall.aab
          retention-days: 30

  # Upload on the self-hosted build fleet only for a release tag or an explicit request.
  # Testers receive the build once Play has processed it.
  play:
    needs: apk
    if: github.ref_type == 'tag' || inputs.upload
    runs-on: [self-hosted, Linux, build]
    defaults: { run: { working-directory: app/android } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wuselwall-aab, path: app/build }
      # Gem keeps its cache under XDG_CACHE_HOME; the self-hosted runner's ~/.cache is not
      # the job's to write (the fleet mounts its own caches there), so the job uses its
      # temporary directory.
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with: { ruby-version: '3.3', bundler-cache: true, working-directory: app/android }
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
      - run: bundle exec fastlane android internal
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
