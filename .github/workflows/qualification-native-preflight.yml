name: Native qualification preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    concurrency:
      group: native-qualification-devices
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect installed native tools and execution architecture
        run: bash qualification/native/preflight.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-qualification-preflight
          path: build/qualification/native-preflight
          if-no-files-found: error
          retention-days: 7
