#cloud-config
# WuselWall on a rented Linux server (VPS) in one step (docs/server/home-server, "Rented
# server"). Paste this file as the server's "user data" / "cloud-init" when you create it:
# Hetzner Cloud, netcup, Scaleway, OVHcloud, Infomaniak and others offer the field. Image:
# Ubuntu 24.04 LTS, x86-64, at least 4 GB of memory. Change the one line marked CHANGE.
#
# Before you create the server, point the two DNS names (api.example.org, web.example.org)
# at the IP address the provider shows: Caddy needs them to fetch its certificates, and it
# keeps retrying until they resolve.
#
# What happens at the first boot: Docker from Docker's own repository, a firewall that lets
# in only SSH, 80 and 443, the WuselWall server release from GitHub, checked against its
# signed SHA256SUMS before anything in it runs, and `wuselwall install --caddy`. After 5–10
# minutes, read the result over SSH:
#
#   ssh root@<ip> cat /srv/wuselwall/install.log
#
# No install.log means the release did not pass the check or could not be downloaded; the
# reason is in /var/log/cloud-init-output.log.
#
# It shows the server address, the setup link with its QR code and the one-time setup key.
# Then copy /srv/wuselwall/stack/.env into your password manager (docs/server/home-server).
# Nothing in this file is secret: every key is generated on the server.
package_update: true
package_upgrade: true

apt:
  sources:
    docker.list:
      source: "deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

packages:
  - ca-certificates
  - curl
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
  - minisign
  - qrencode
  - ufw

write_files:
  - path: /usr/local/sbin/wuselwall-first-boot
    permissions: "0755"
    content: |
      #!/bin/sh
      # Written by server/cloud-init.yaml; runs once, at the first boot.
      set -eu
      : "${WW_VERSION:?the WuselWall server release, e.g. 1.0.0}"
      : "${WW_API:?https://api.example.org}" "${WW_WEB:?https://web.example.org}" "${WW_LANGUAGE:=de}"
      ufw allow OpenSSH > /dev/null
      ufw allow 80/tcp > /dev/null
      ufw allow 443/tcp > /dev/null
      ufw --force enable > /dev/null
      systemctl enable --now docker
      # The release, its SHA256SUMS and the signature of those, checked before unpacking
      # (security review 2026-11-01, F9). The key is server/wuselwall's WW_RELEASE_PUBKEY.
      key=RWQkSenBTFOIn4wZCJQTUyXTgTwX8mO+WCK3WOn9W52Yer+3h7Bpmyp/
      archive=wuselwall-server-$WW_VERSION.tar.gz
      base=https://github.com/wuselwall/wuselwall-app/releases/download/server-v$WW_VERSION
      dl=$(mktemp -d) && cd "$dl"
      for f in "$archive" SHA256SUMS SHA256SUMS.minisig; do curl -fsSLO "$base/$f"; done
      case $key in
        RW*)
          # Only the prehashed signatures the release workflow makes (minisign also takes legacy ones).
          [ "$(sed -n 2p SHA256SUMS.minisig | base64 -d | head -c 2)" = ED ] || { echo "not a prehashed (ED) signature" >&2; exit 1; }
          # The signed comment names the release, so an older signed one cannot stand in.
          comment=$(minisign -V -Q -m SHA256SUMS -P "$key")
          [ "$comment" = "wuselwall-server $WW_VERSION SHA256SUMS" ] || { echo "signed for another release: $comment" >&2; exit 1; }
          checked="Release $WW_VERSION: the signature and the checksum match." ;;
        *) checked="WARNING: this cloud-init file has no release key; only the checksum of release $WW_VERSION was checked." ;;
      esac
      grep " $archive\$" SHA256SUMS | sha256sum -c -
      mkdir -p /srv && tar -xzf "$archive" -C /srv
      cd /srv/wuselwall && rm -rf "$dl"
      # The log holds the setup key: readable by root only.
      umask 077
      { echo "$checked"; ./wuselwall install --api "$WW_API" --web "$WW_WEB" --language "$WW_LANGUAGE" --caddy; } > install.log 2>&1

runcmd:
  # CHANGE the four values on the next line (release, the two addresses, the email language de|en|fr|es); nothing else.
  - [sh, -c, "WW_VERSION=1.0.0 WW_API=https://api.example.org WW_WEB=https://web.example.org WW_LANGUAGE=de /usr/local/sbin/wuselwall-first-boot"]
