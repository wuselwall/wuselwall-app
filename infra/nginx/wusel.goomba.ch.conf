# wusel.example.org → the Supabase gateway (Envoy) of the compose stack on the home server
# (specs/10, ADR-013 amendment). Copy into the nginx container's site directory, then:
# nginx -t && nginx -s reload
#
# Only the four API prefixes are forwarded to the gateway; Studio and the metadata API
# (/pg/) and the bare /rest/v1/ listing are refused; everything else is the Flutter web
# app. The gateway listens on the Docker bridge address (172.17.0.1), which this
# container reaches and the home network does not. Never proxy Postgres (127.0.0.1:54422).
# Add /storage/v1/ only once Storage is used.

# Upgrade the connection only for WebSockets, so upstream keepalive works for the rest.
# (Own name, so it cannot clash with a $connection_upgrade map elsewhere.)
map $http_upgrade $wusel_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream wusel_backend {
    server 172.17.0.1:54421;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wusel.example.org;

    ssl_certificate         /config/keys/cloudflare.pem;
    ssl_certificate_key     /config/keys/cloudflare.key;
    ssl_trusted_certificate /config/keys/cloudflare_ca.pem;
    ssl_dhparam             /config/keys/dhparam.pem;
    ssl_session_tickets     on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain application/json text/css application/javascript image/svg+xml;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Cloudflare's header carries the client address; api.enrol_device rate-limits on it.
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $wusel_connection_upgrade;

    proxy_redirect off;
    proxy_buffering off;
    proxy_read_timeout 300s;

    # PostgREST's schema listing at the bare prefix: nothing an app needs.
    location = /rest/v1/    { return 404; }

    location /auth/v1/      { proxy_pass http://wusel_backend; }
    location /rest/v1/      { proxy_pass http://wusel_backend; }
    location /realtime/v1/  { proxy_pass http://wusel_backend; }
    location /functions/v1/ { proxy_pass http://wusel_backend; }

    # The gateway's metadata API and Studio are never reachable, even by accident through
    # the web app's fallback below.
    location ^~ /pg/ { return 404; }

    # The Android app for installing by hand (scripts/deploy-apk.sh), outside the web
    # app's folder so a web deploy does not remove it.
    location /download/ {
        alias /config/www/wuselwall-download/;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache" always;
    }

    # Everything else is the Flutter web app (scripts/deploy-web.sh). Unknown paths fall
    # back to index.html so the app's own routes survive a reload. Flutter's file names
    # are not content-hashed, so the browser revalidates every file (cheap: ETag).
    location / {
        root /config/www/wuselwall;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
