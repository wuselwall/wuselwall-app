# wusel.goomba.ch → the Supabase gateway (Envoy) of the compose stack on the home server
# (specs/10, ADR-013 amendment). Copy into the nginx container's site directory, then:
# nginx -t && nginx -s reload
#
# Only the four API prefixes are forwarded to the gateway; Studio and the metadata API
# (/pg/) and the bare /rest/v1/ listing are refused; /app/ is the Flutter web app;
# everything else is the website (landing page, Impressum, Datenschutz). The gateway listens on the Docker bridge address (172.17.0.1), which this
# container reaches and the home network does not. Never proxy Postgres (127.0.0.1:54422).
# Add /storage/v1/ only once Storage is used.

# Upgrade the connection only for WebSockets, so upstream keepalive works for the rest.
# (Own name, so it cannot clash with a $connection_upgrade map elsewhere.)
map $http_upgrade $wusel_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream wusel_backend {
    server 172.17.0.1:54421;
    keepalive 32;
}

# The website container (infra/web), on the same bridge address, its own compose project.
upstream wusel_site {
    server 172.17.0.1:54480;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wusel.goomba.ch;

    ssl_certificate         /config/keys/cloudflare.pem;
    ssl_certificate_key     /config/keys/cloudflare.key;
    ssl_trusted_certificate /config/keys/cloudflare_ca.pem;
    ssl_dhparam             /config/keys/dhparam.pem;
    ssl_session_tickets     on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain application/json text/css application/javascript image/svg+xml;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Cloudflare's header carries the client address; api.enrol_device rate-limits on it.
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $wusel_connection_upgrade;

    proxy_redirect off;
    proxy_buffering off;
    proxy_read_timeout 300s;

    # PostgREST's schema listing at the bare prefix: nothing an app needs.
    location = /rest/v1/    { return 404; }

    location /auth/v1/      { proxy_pass http://wusel_backend; }
    location /rest/v1/      { proxy_pass http://wusel_backend; }
    location /realtime/v1/  { proxy_pass http://wusel_backend; }
    location /functions/v1/ { proxy_pass http://wusel_backend; }

    # The gateway's metadata API and Studio are never reachable, even by accident through
    # the website's fallback below.
    location ^~ /pg/ { return 404; }

    # The Android app for installing by hand (scripts/deploy-apk.sh), outside the web
    # app's folder so a web deploy does not remove it.
    location /download/ {
        alias /config/www/wuselwall-download/;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache" always;
    }

    # The Flutter web app (scripts/deploy-web.sh, built with --base-href /app/). Unknown
    # paths fall back to its index.html so its own routes survive a reload. Flutter's file
    # names are not content-hashed, so the browser revalidates every file (cheap: ETag).
    location = /app { return 301 /app/; }
    location /app/ {
        alias /config/www/wuselwall/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Everything else is the website: server-rendered HTML from the Node container. Static
    # files under /.well-known/, /i/ and /p/ (ADR-014) get their own location above this
    # one when they exist. Cloudflare may cache pages; assets under /_astro/ are hashed.
    location /_astro/ {
        proxy_pass http://wusel_site;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        proxy_pass http://wusel_site;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
