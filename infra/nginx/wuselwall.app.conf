# WuselWall on the home server's nginx (specs/10, ADR-017). Copy into the nginx
# container's site directory, then: nginx -t && nginx -s reload
#
#   wuselwall.app       the website (landing page, Impressum, Datenschutz), /docs/ (the user
#                       documentation) and /download/ (the Android APK)
#   web.wuselwall.app   the Flutter web app
#   api.wuselwall.app   the Supabase gateway (Envoy): only the four API prefixes. Studio, the
#                       metadata API (/pg/), the bare /rest/v1/ listing and everything else 404
#   wusel.goomba.ch     the old address: the API prefixes still reach the gateway for app
#                       builds that carry it, everything else redirects to its new home.
#                       Remove that server block once no installed app uses the old URL.
#
# TLS: Cloudflare origin certificates (SSL mode Full (strict)), one for wuselwall.app and
# *.wuselwall.app, the existing *.goomba.ch one for the old address. The gateway and the
# website listen on the Docker bridge address (172.17.0.1), which this container reaches and
# the home network does not. Never proxy Postgres (127.0.0.1:54422). Add /storage/v1/ only
# once Storage is used.

# Upgrade the connection only for WebSockets, so upstream keepalive works for the rest.
# (Own name, so it cannot clash with a $connection_upgrade map elsewhere.)
map $http_upgrade $wusel_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream wusel_backend {
    server 172.17.0.1:54421;
    keepalive 32;
}

# The website container (infra/web), on the same bridge address, its own compose project.
upstream wusel_site {
    server 172.17.0.1:54480;
    keepalive 8;
}

# ---------------------------------------------------------------- api.wuselwall.app
server {
    listen 443 ssl;
    http2 on;
    server_name api.wuselwall.app;

    ssl_certificate         /config/keys/wuselwall.app.pem;
    ssl_certificate_key     /config/keys/wuselwall.app.key;
    ssl_trusted_certificate /config/keys/cloudflare_ca.pem;
    ssl_dhparam             /config/keys/dhparam.pem;
    ssl_session_tickets     on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain application/json;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Cloudflare's header carries the client address; api.enrol_device rate-limits on it.
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $wusel_connection_upgrade;

    proxy_redirect off;
    proxy_buffering off;
    proxy_read_timeout 300s;

    # PostgREST's schema listing at the bare prefix: nothing an app needs.
    location = /rest/v1/    { return 404; }

    location /auth/v1/      { proxy_pass http://wusel_backend; }
    location /rest/v1/      { proxy_pass http://wusel_backend; }
    location /realtime/v1/  { proxy_pass http://wusel_backend; }
    location /functions/v1/ { proxy_pass http://wusel_backend; }

    # Everything else of the gateway, Studio and the metadata API (/pg/) included.
    location / { return 404; }
}

# ---------------------------------------------------------------- web.wuselwall.app
# The Flutter web app (scripts/deploy-web.sh, built with --base-href /). Unknown paths fall
# back to index.html so its own routes survive a reload. Flutter's file names are not
# content-hashed, so the browser revalidates every file (cheap: ETag).
server {
    listen 443 ssl;
    http2 on;
    server_name web.wuselwall.app;

    ssl_certificate         /config/keys/wuselwall.app.pem;
    ssl_certificate_key     /config/keys/wuselwall.app.key;
    ssl_trusted_certificate /config/keys/cloudflare_ca.pem;
    ssl_dhparam             /config/keys/dhparam.pem;
    ssl_session_tickets     on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain application/json text/css application/javascript application/wasm image/svg+xml;

    root /config/www/wuselwall;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}

# ---------------------------------------------------------------- wuselwall.app
server {
    listen 443 ssl;
    http2 on;
    server_name wuselwall.app;

    ssl_certificate         /config/keys/wuselwall.app.pem;
    ssl_certificate_key     /config/keys/wuselwall.app.key;
    ssl_trusted_certificate /config/keys/cloudflare_ca.pem;
    ssl_dhparam             /config/keys/dhparam.pem;
    ssl_session_tickets     on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain application/json text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The web app lived at /app/ under the old address; send old links to its own host.
    location = /app { return 301 https://web.wuselwall.app/; }
    location /app/ { rewrite ^/app/(.*)$ https://web.wuselwall.app/$1 permanent; }

    # The Android app for installing by hand (scripts/deploy-apk.sh).
    location /download/ {
        alias /config/www/wuselwall-download/;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache" always;
    }

    # The user documentation (docs/, built and published by .github/workflows/docs.yml).
    # Each deploy is a folder under releases/ and "current" links to the live one
    # (infra/docs/receive-docs.sh). VitePress writes clean URLs, so /docs/guide/setup is
    # guide/setup.html; files under assets/ are content-hashed.
    location = /docs { return 301 /docs/; }
    location /docs/assets/ {
        alias /config/www/wuselwall-docs/current/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /docs/ {
        alias /config/www/wuselwall-docs/current/;
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # Everything else is the website: server-rendered HTML from the Node container. Static
    # files under /.well-known/, /i/ and /p/ (ADR-014) get their own location above this
    # one when they exist. Cloudflare may cache pages; assets under /_astro/ are hashed.
    location /_astro/ {
        proxy_pass http://wusel_site;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        proxy_pass http://wusel_site;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}

# ---------------------------------------------------------------- wusel.goomba.ch (old)
# App builds from before ADR-017 call the API here, so its four prefixes stay forwarded,
# exactly as on api.wuselwall.app. Pages, docs and downloads redirect to their new hosts.
server {
    listen 443 ssl;
    http2 on;
    server_name wusel.goomba.ch;

    ssl_certificate         /config/keys/cloudflare.pem;
    ssl_certificate_key     /config/keys/cloudflare.key;
    ssl_trusted_certificate /config/keys/cloudflare_ca.pem;
    ssl_dhparam             /config/keys/dhparam.pem;
    ssl_session_tickets     on;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $wusel_connection_upgrade;

    proxy_redirect off;
    proxy_buffering off;
    proxy_read_timeout 300s;

    location = /rest/v1/    { return 404; }

    location /auth/v1/      { proxy_pass http://wusel_backend; }
    location /rest/v1/      { proxy_pass http://wusel_backend; }
    location /realtime/v1/  { proxy_pass http://wusel_backend; }
    location /functions/v1/ { proxy_pass http://wusel_backend; }

    location ^~ /pg/ { return 404; }

    location = /app { return 301 https://web.wuselwall.app/; }
    location /app/ { rewrite ^/app/(.*)$ https://web.wuselwall.app/$1 permanent; }
    location / { return 301 https://wuselwall.app$request_uri; }
}
