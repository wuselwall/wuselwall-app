# WuselWall's layer over Supabase's official self-hosting compose file (ADR-013 amendment).
#
# docker-compose.yml and volumes/ (api/, db/, functions/deno.jsonc) are upstream, copied
# verbatim from
#   https://github.com/supabase/supabase/tree/3fc8af387ec4dfb449510828a938e1f6e57a9575/docker
# Never edit them; every change lives here, so an upstream update is a copy plus a diff
# of this file (specs/10#updates). Two exceptions, listed in NOTICE: volumes/functions/
# main/index.ts is upstream's router with a few marked WuselWall lines, and volumes/caddy/
# is WuselWall's own.
#
# What this file changes, and why:
# - Images: the exact versions the pinned Supabase CLI (package.json) runs, so the home
#   server, CI and a laptop stack run the same Postgres 15, GoTrue, PostgREST and Realtime.
# - Exposure: the gateway listens on the Docker bridge address only (nginx reaches it,
#   the home network does not); Postgres on 127.0.0.1 only; no pooler, no Mailpit.
# - Auth: the settings of supabase/config.toml's [auth] section, as GoTrue variables.
# - Keys: JWKS everywhere, so tokens signed with the old HS256 secret stay valid next to
#   the ES256 key pair (infra/supabase/make-env.mjs).

name: wuselwall

services:
  studio:
    image: public.ecr.aws/supabase/studio:2026.10.05-sha-94b8b06

  api-gw:
    ports: !override
      - ${GATEWAY_BIND:-172.17.0.1}:${GATEWAY_PORT:-54421}:8000/tcp

  auth:
    image: ghcr.io/supabase/gotrue:v2.197.0
    depends_on:
      mail-templates:
        condition: service_healthy
    environment:
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://mail-templates/${MAIL_LANGUAGE:-de}/confirmation.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://mail-templates/${MAIL_LANGUAGE:-de}/magic_link.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://mail-templates/${MAIL_LANGUAGE:-de}/recovery.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://mail-templates/${MAIL_LANGUAGE:-de}/email_change.html
      GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: http://mail-templates/${MAIL_LANGUAGE:-de}/reauthentication.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://mail-templates/${MAIL_LANGUAGE:-de}/invite.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: ${MAIL_CODE_SUBJECT:-Dein WuselWall-Code}
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: ${MAIL_CODE_SUBJECT:-Dein WuselWall-Code}
      GOTRUE_MAILER_SUBJECTS_RECOVERY: ${MAIL_CODE_SUBJECT:-Dein WuselWall-Code}
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: ${MAIL_CODE_SUBJECT:-Dein WuselWall-Code}
      GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: ${MAIL_CODE_SUBJECT:-Dein WuselWall-Code}
      GOTRUE_MAILER_SUBJECTS_INVITE: ${MAIL_CODE_SUBJECT:-Dein WuselWall-Code}
      # Sign with the EC key, verify the legacy HS256 secret too.
      GOTRUE_JWT_KEYS: ${JWT_KEYS}
      GOTRUE_PASSWORD_MIN_LENGTH: 10
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_PHONE_ENROLL_ENABLED: "false"
      GOTRUE_MFA_PHONE_VERIFY_ENABLED: "false"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 10
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/app/custom_access_token_hook
      # Passkeys: bound to the public domain (the CLI's "localhost" never worked here).
      GOTRUE_PASSKEY_ENABLED: "true"
      GOTRUE_WEBAUTHN_RP_DISPLAY_NAME: WuselWall
      GOTRUE_WEBAUTHN_RP_ID: ${PASSKEY_RP_ID}
      GOTRUE_WEBAUTHN_RP_ORIGINS: ${PASSKEY_RP_ORIGINS}
      # Mail (specs/10 §4 "Email setup") is optional: without it ENABLE_EMAIL_AUTOCONFIRM is
      # true and everyone signs in with a password (make-env.mjs, mail-settings.sh). The Send
      # Email Hook hands every mail to the send-email Edge Function, which renders it in
      # MAIL_LANGUAGE and sends it through Scaleway Transactional Email. It is switched on by
      # make-env.mjs once the stack's .env has the SCW_* values (or by hand: set-env
      # SEND_EMAIL_HOOK_ENABLED true). Its secret is the v1,whsec_ value the functions container
      # checks the signature with. Otherwise GoTrue sends through the SMTP_* values in the .env
      # (`wuselwall mail smtp`; any SMTP server, Gmail included). Both signup and returning sign-in
      # use codes, not links. GoTrue loads that language's supabase/templates/ files through
      # the internal-only mail-templates service (copied by the release/deploy scripts).
      #
      # The hook's address is HTTPS, the server's own public one (<api>/functions/v1/send-email),
      # and empty while the hook is off: GoTrue refuses a plain-http hook address unless it is
      # localhost, even with the hook off, and then exits at start (found 2026-10-16, when
      # http://functions:9000 stopped Auth on the first server that got this layer).
      GOTRUE_HOOK_SEND_EMAIL_ENABLED: ${SEND_EMAIL_HOOK_ENABLED:-false}
      GOTRUE_HOOK_SEND_EMAIL_URI: ${SEND_EMAIL_HOOK_URI:-}
      GOTRUE_HOOK_SEND_EMAIL_SECRETS: ${SEND_EMAIL_HOOK_SECRET:-}
      # The CLI's limits; e-mail at most 30 an hour, whichever way it is sent.
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
      GOTRUE_RATE_LIMIT_VERIFY: 30
      GOTRUE_RATE_LIMIT_OTP: 30
      GOTRUE_RATE_LIMIT_SMS_SENT: 30
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: 30
      GOTRUE_RATE_LIMIT_WEB3: 30
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 30
      # The e-mail sign-in code (supabase/config.toml [auth.email]): six digits, 600 s, one
      # new code per address every 60 s.
      GOTRUE_MAILER_OTP_LENGTH: ${MAILER_OTP_LENGTH:-6}
      GOTRUE_MAILER_OTP_EXP: ${MAILER_OTP_EXP:-600}
      GOTRUE_SMTP_MAX_FREQUENCY: ${SMTP_MAX_FREQUENCY:-60s}

  # No public ports, no Caddy dependency, no credentials or household data. Auth fetches
  # raw Go templates over the Compose network; SMTP remains the operator's choice.
  mail-templates:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    volumes:
      - ./volumes/mail-templates:/usr/share/nginx/html:ro,z
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/${MAIL_LANGUAGE:-de}/confirmation.html && wget -q -O /dev/null http://127.0.0.1/${MAIL_LANGUAGE:-de}/magic_link.html"]
      interval: 5s
      timeout: 3s
      retries: 5

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.4

  realtime:
    image: ghcr.io/supabase/realtime:v2.140.10
    environment:
      API_JWT_JWKS: ${JWT_JWKS}

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.79.36
    environment:
      JWT_JWKS: ${JWT_JWKS}

  meta:
    image: ghcr.io/supabase/postgres-meta:v0.100.0

  functions:
    image: public.ecr.aws/supabase/edge-runtime:v1.77.4
    environment:
      SUPABASE_JWKS: ${JWT_JWKS}
      # The shared secret of the nightly task job (supabase/functions/tasks-nightly): the
      # host's cron sends it as x-cron-secret. Empty = the job refuses every call.
      CRON_SECRET: ${CRON_SECRET:-}
      # The Send Email Hook (supabase/functions/send-email): the signature secret GoTrue signs
      # with, and Scaleway Transactional Email (specs/10 §4). SCW_SECRET_KEY is the secret key of
      # an IAM application whose only policy is Transactional Email on SCW_PROJECT_ID. Every
      # function in this container can read these; the send-email function is the only one that does.
      SEND_EMAIL_HOOK_SECRET: ${SEND_EMAIL_HOOK_SECRET:-}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      SCW_PROJECT_ID: ${SCW_PROJECT_ID:-}
      SCW_REGION: ${SCW_REGION:-fr-par}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-WuselWall}
      MAIL_LANGUAGE: ${MAIL_LANGUAGE:-de}
      # The family's own text recognition for photographed timetables (specs/24, the
      # timetable-scan function): the address of the optional ocr service below. Empty = the
      # app offers the paste import only.
      OCR_URL: ${OCR_URL:-}
      # The server release the stack runs (server/wuselwall writes it on install and update):
      # the discovery document announces it, and the app's settings show it.
      WW_SERVER_VERSION: ${WW_SERVER_VERSION:-}

  # Optional (profile `ocr`): RapidOCR on the CPU, built from ./ocr, no public port, no internet
  # once built. docs/server/extras.md "Texterkennung". Start with
  #   docker compose --profile ocr up -d --build
  # and set OCR_URL=http://ocr:9003/ocr in .env.
  ocr:
    build: ./ocr
    image: wuselwall/ocr:local
    profiles: [ocr]
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9003/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    # Postgres 15, as supabase/config.toml ([db] major_version) and CI.
    image: public.ecr.aws/supabase/postgres:15.19.0.004
    ports:
      # For migrations, pgTAP and Studio through an SSH tunnel; never on the network.
      - 127.0.0.1:${DB_PORT:-54422}:5432/tcp

  # The pooler is not needed for one household and would publish 5432 and 6543.
  supavisor:
    profiles: [disabled]
